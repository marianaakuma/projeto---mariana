<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSOC Dashboard Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="left-panel">
            <div class="logo-container">
                 <img src="/a/40c803fe-1555-4283-8253-99f3256d85e3" alt="NSOC Dashboard Logo" class="logo">
                 <!-- Original text was difficult to read, using placeholder -->
                 <h1>NSOC DASHBOARD</h1>
                 <p>Menuju Lembaga Cyber World Class</p>
            </div>
        </div>
        <div class="right-panel">
            <form class="login-form">
                <div class="form-group">
                    <label for="email">Your email</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>
                <div class="form-options">
                    <div class="remember-me">
                        <input type="checkbox" id="remember">
                        <label for="remember">Remember me</label>
                    </div>
                    <a href="#" class="forgot-password">Recover password</a>
                </div>
                <button type="submit" class="signin-button">SIGN IN</button>
            </form>
        </div>
    </div>
</body>
</html>
